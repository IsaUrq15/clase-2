<!doctype html>
<html lang="es" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.rtl.min.css" integrity="sha384-Xbg45MqvDIk1e563NLpGEulpX6AvL404DP+/iCgW9eFa2BqztiwTexswJo2jLMue" crossorigin="anonymous">

    <title>Registro de Usuarios</title>
  </head>
  <body class="container py-5">

    <h1 class="mb-4 text-center">Registro de Usuarios</h1>

    <form id="userForm" class="mb-4">
      <div class="mb-3">
        <label for="username" class="form-label">Nombre de usuario</label>
        <input type="text" class="form-control" id="username" required>
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Correo electrónico</label>
        <input type="email" class="form-control" id="email" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <input type="password" class="form-control" id="password" required>
      </div>
      <div class="mb-3">
        <label for="birthdate" class="form-label">Fecha de nacimiento</label>
        <input type="date" class="form-control" id="birthdate" required>
      </div>
      <button type="submit" class="btn btn-success">Registrar</button>
    </form>


    <h2 class="mb-3">Lista de Usuarios Registrados</h2>
    <table class="table table-striped text-center">
      <thead>
        <tr>
          <th>Nombre de usuario</th>
          <th>Correo electrónico</th>
          <th>Fecha de nacimiento</th>
        </tr>
      </thead>
      <tbody id="userList">
       
      </tbody>
    </table>

    <script>
      document.getElementById('userForm').addEventListener('submit', function (e) {
        e.preventDefault();

        const username = document.getElementById('username').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const birthdate = document.getElementById('birthdate').value;

        const table = document.getElementById('userList');
        const row = document.createElement('tr');

        row.innerHTML = `
          <td>${username}</td>
          <td>${email}</td>
          <td>${birthdate}</td>
        `;

        table.appendChild(row);

        this.reset(); // Limpiar el formulario
      });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
  </body>
</html>
